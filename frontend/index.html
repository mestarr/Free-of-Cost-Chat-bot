<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Crypto Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161a22;
      --border: #2a3142;
      --text: #e6eaf0;
      --muted: #8b92a8;
      --accent: #00d4aa;
      --accent-dim: #00a884;
      --user-msg: #1e2433;
      --bot-msg: #161a22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }
    .msg {
      padding: 1rem 1.25rem;
      border-radius: 12px;
      max-width: 90%;
      line-height: 1.55;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-msg);
      border: 1px solid var(--border);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bot-msg);
      border: 1px solid var(--border);
    }
    .msg .role {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .msg pre, .msg code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9em;
    }
    .msg pre {
      background: rgba(0,0,0,0.25);
      padding: 0.75rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5rem 0;
    }
    .msg p { margin: 0.35em 0; }
    .msg p:first-child { margin-top: 0; }
    .msg p:last-child { margin-bottom: 0; }
    #input-area {
      padding: 1rem 1.5rem 2rem;
      border-top: 1px solid var(--border);
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }
    #form {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.85rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      resize: none;
      min-height: 48px;
      max-height: 160px;
    }
    #input::placeholder { color: var(--muted); }
    #input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,212,170,0.15);
    }
    #send {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.85rem 1.25rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      transition: background 0.2s;
    }
    #send:hover { background: var(--accent-dim); }
    #send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      background: rgba(220, 60, 60, 0.15);
      border-color: rgba(220, 60, 60, 0.4);
      color: #f0a0a0;
    }
    .typing::after {
      content: '...';
      animation: dots 1s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">₿</div>
    <h1>Free Crypto Chatbot</h1>
  </header>
  <div id="messages"></div>
  <div id="input-area">
    <form id="form">
      <textarea id="input" placeholder="Ask about crypto, DeFi, wallets, Bitcoin, Ethereum..." rows="1"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </div>
  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    let conversation = [];

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function formatContent(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
          `<pre><code>${escapeHtml(code.trim())}</code></pre>`
        )
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function addMessage(role, content, isError = false) {
      const div = document.createElement('div');
      div.className = `msg ${role}${isError ? ' error' : ''}`;
      div.innerHTML = `<span class="role">${role}</span><div class="content">${formatContent(content)}</div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function setTyping(div, on) {
      const content = div.querySelector('.content');
      if (on) content.classList.add('typing');
      else content.classList.remove('typing');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      addMessage('user', text);
      conversation.push({ role: 'user', content: text });

      const botDiv = addMessage('assistant', '');
      setTyping(botDiv, true);
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation }),
        });
        const data = await res.json().catch(() => ({}));
        setTyping(botDiv, false);

        if (!res.ok) {
          botDiv.querySelector('.content').innerHTML = formatContent(data.detail || res.statusText || 'Request failed.');
          botDiv.classList.add('error');
          return;
        }
        const reply = data.message || '';
        botDiv.querySelector('.content').innerHTML = formatContent(reply);
        conversation.push({ role: 'assistant', content: reply });
      } catch (err) {
        setTyping(botDiv, false);
        botDiv.querySelector('.content').innerHTML = formatContent('Network error. Is the server running? Is Ollama running?');
        botDiv.classList.add('error');
      } finally {
        sendBtn.disabled = false;
      }
    });

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });
  </script>
</body>
</html>
